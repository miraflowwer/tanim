name: TANIM CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Python checks
        run: |
          python tests/test_datasets.py
          python tests/test_crop_registry.py
          python tests/test_yield_reference.py
          python tests/test_grci.py
          python tests/test_service.py
          python tests/test_mvp_e2e.py
          python tests/test_deployment.py

  frontend-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Test frontend request contract
        run: npm test
      - name: Build farmer UI
        run: npm run build

  live-openstat-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every PSA OpenSTAT table
        run: python scripts/fetch_openstat_luzon.py --verify-only
      - name: Audit live crop registry
        run: python scripts/build_crop_registry.py --check-only
      - name: Audit yield reference and live sample
        run: python scripts/build_yield_reference.py --check-only --live-sample
