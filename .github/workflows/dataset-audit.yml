name: Dataset audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dataset tests
        run: |
          python tests/test_datasets.py
          python tests/test_crop_registry.py

  live-openstat-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every PSA OpenSTAT table
        run: python scripts/fetch_openstat_luzon.py --verify-only
