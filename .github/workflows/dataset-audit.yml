name: Dataset audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dataset tests
        run: |
          python tests/test_datasets.py
          python tests/test_crop_registry.py

  live-openstat-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every PSA OpenSTAT table
        run: python scripts/fetch_openstat_luzon.py --verify-only
      - name: Audit live crop registry
        run: python scripts/build_crop_registry.py --check-only
      - name: Build live crop registry snapshot
        run: python scripts/build_crop_registry.py
      - name: Upload crop registry snapshot
        uses: actions/upload-artifact@v4
        with:
          name: crop-registry-snapshot
          path: |
            datasets/generated/
            docs/CROP_COVERAGE.md
          if-no-files-found: error
      - name: Commit live crop registry snapshot
        if: >-
          github.event_name == 'push' &&
          github.event.head_commit.message == 'data: materialize live crop registry'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/generated docs/CROP_COVERAGE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: materialize Explorer crop catalog"
          git push
