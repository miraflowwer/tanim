name: Dataset audit

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dataset tests
        run: |
          python tests/test_datasets.py
          python tests/test_crop_registry.py
          python tests/test_yield_reference.py
          python tests/test_grci.py
          python tests/test_mvp_e2e.py

  live-openstat-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every PSA OpenSTAT table
        run: python scripts/fetch_openstat_luzon.py --verify-only
      - name: Audit live crop registry
        run: python scripts/build_crop_registry.py --check-only
      - name: Audit yield reference and live sample
        run: python scripts/build_yield_reference.py --check-only --live-sample
