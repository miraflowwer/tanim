# Alembic config (PRD §15). No secrets: real URL comes from DATABASE_URL env var
# and overrides sqlalchemy.url below (see env.py).
[alembic]
script_location = alembic
sqlalchemy.url = postgresql+psycopg://localhost/tanim

[loggers]
keys = root,sqlalchemy,alembic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handlers]
keys = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
